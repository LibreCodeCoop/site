name: Deploy PR previews

on:
  workflow_run:
    workflows: ["Preview Build"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: site-preview-deploy
  cancel-in-progress: false

jobs:
  deploy-preview:
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # workflow_run.pull_requests may be empty for fork PRs.
      - name: Resolve PR number from preview build
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          ref="$SOURCE_BRANCH"
          if [[ "$SOURCE_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
            ref="${SOURCE_REPOSITORY%%/*}:$SOURCE_BRANCH"
          fi
          gh pr view "$ref" -R "$GITHUB_REPOSITORY" \
            --json number,state,headRefOid,headRepository,baseRefName |
            jq -er --arg sha "$SOURCE_SHA" --arg repo "$SOURCE_REPOSITORY" \
              'select(.state == "OPEN" and .baseRefName == "main" and
                      .headRefOid == $sha and .headRepository.nameWithOwner == $repo) |
               "number=\(.number)"' >> "$GITHUB_OUTPUT"

      - name: Download preview build artifact
        uses: actions/download-artifact@v4
        with:
          name: preview-build
          path: build_production/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Installation token can only write contents in the preview repository.
      # A dedicated GitHub App must be installed only on site-preview.
      - name: Get scoped publication token
        id: publication-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SITE_PREVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.SITE_PREVIEW_APP_PRIVATE_KEY }}
          owner: LibreCodeCoop
          repositories: site-preview
          permission-contents: write

      - name: Deploy preview
        uses: LibreSign/pr-preview-action@2a6da1177b47dc23173ba9a75e01da0a0d800978
        with:
          action: deploy
          source-dir: ./build_production/
          pr-number: ${{ steps.pr.outputs.number }}
          pages-base-url: librecodecoop.github.io/site-preview
          deploy-repository: LibreCodeCoop/site-preview
          preview-branch: main
          wait-for-pages-deployment: false
          token: ${{ steps.publication-token.outputs.token }}
